# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AGENTS.md and the knowledge_base docs are the house rules and win over this file.

language: en-US

tone_instructions: >-
  Senior Swift and macOS engineer. Direct and terse. Raise only issues that would block a merge.
  Name the problem, the fix and why it matters. No praise, no recaps, no nits.

reviews:
  profile: quiet

  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  auto_title_instructions: >-
    Conventional Commits: <type>(<scope>): <description>, lowercase imperative, no trailing period.

  auto_review:
    drafts: false
    ignore_title_keywords:
      - DO NOT REVIEW
      - merge upstream

  # Exclude-only: these also drive the sparse checkout, so an excluded file is never even context.
  path_filters:
    - "!**/*.generated.swift"
    - "!**/*.generated.js"
    - "!Pipcast/Resources/EmojiKeywords/**"
    - "!Pipcast.xcodeproj/**"
    - "!Pipcast/Assets.xcassets/**"
    - "!Pipcast/pipcast.icon/**"
    - "!**/pnpm-lock.yaml"
    - "!**/node_modules/**"
    - "!Tests/ai-fixtures/**"
    - "!build/**"

  path_instructions:
    - path: "**/*.swift"
      instructions: |
        Report only what would block a merge: a bug, regression, crash or trap; data loss or
        inconsistent persisted state; a security or privacy hole, or a secret or PII in a log; a data
        race, deadlock, or a task or observer with no owner or teardown; blocking IO on the main
        actor, a leak, or a clear memory or speed regression; a deprecated API; a break of an
        AGENTS.md non-negotiable or a docs/features/*.md invariant. No finding beats a weak one.
        Always give the fix, and check the affected call sites before claiming a regression.

        Before flagging a captured value or a shadowed name, confirm the lexical scope. Before
        flagging a missing API, confirm it against the macOS 26/27 SDK and Swift 6 compiler.
        When a feature folder changes, read the Invariants section of its docs/features/ doc.

        Palette budget: resident memory under 100 MB and an instant-feeling palette. Flag work
        repeated per keystroke, per row or per render, hidden O(n^2), unbounded caches, and new
        eager work in AppCore.start() or an init that could run on first use.

        Never suggest:
        - Compatibility layers, support below macOS 26, migration scaffolding or speculative fallbacks.
        - A singleton or static shared; AppCore owns long-lived state.
        - A new actor or global actor; @MainActor is the default and synchronous code is preferred.
        - async, a Task or an actor only because state is shared; preserve synchronous callbacks.
        - NSAlert, .alert, .confirmationDialog or .popover; use DialogController or HUDPresenter.
        - URLSession.shared; networking copies CurrencyRateStore's ephemeral session.
        - scrollEdgeEffectStyle in the borderless panels; they use edgeDissolve().
        - XCTest or Swift Testing; Tests/ holds standalone harnesses.
        - Doc comments or comment blocks; comments are rare, one line, and explain the why.
        - Third-party packages or SwiftPM.
        - isEmpty for count on PaletteRowIndex; that count is a hit count.
        - Anything SwiftLint already reports, or formatting.
        @available(*, unavailable) on init(coder:) is intentional.

    - path: "Pipcast/Features/*/Model/**"
      instructions: |
        Pure model layer, compiled directly by the test harnesses.
        - No import of AppKit, SwiftUI or Cocoa.
        - Clock, filesystem, home directory, locale and rates come in as parameters. Flag new
          ambient reads of Date(), FileManager.default, NSHomeDirectory() or Locale.current that
          a harness cannot override; defaulted injected parameters are allowed.

    - path: "Pipcast/Features/Extensions/**"
      instructions: |
        Runs untrusted Raycast extensions in JavaScriptCore.
        - Treat every JS value as hostile: check types, sizes, paths and URLs.
        - Flag retain cycles between JS callbacks and Swift owners.
        - Views, layout and sizing stay in this folder. Only Theme base tokens, InterfaceMetrics,
          PopoverMenuItem and Platform/ come from outside. Duplicated views or layout maths here are
          intentional; duplicated runtime logic is not.

    - path: "Scripts/raycast-runtime/**"
      instructions: |
        Source of the JS shim bundled into Pipcast/Resources/RaycastRuntime.generated.js, which runs
        alongside untrusted extension code. Flag anything that widens what an extension can reach
        on the host.

    - path: "Pipcast/DesignSystem/Scrolling/{EdgeDissolve,ThinScrollbar}.swift"
      instructions: |
        Off-limits, tuned by eye. Flag any edit unless the PR says it exists to change this file.

    - path: "Pipcast/Resources/*.xcstrings"
      instructions: |
        Only check the entries this PR adds or changes: every one is translated into all eight
        languages, and format specifiers match the source string. Do not review wording.

    - path: "{project.yml,Pipcast/*.entitlements,**/Info.plist}"
      instructions: |
        project.yml is the XcodeGen source of truth. Flag any new entitlement, hardened-runtime
        exception, usage description or deployment target change, and ask for the reason.

    - path: ".github/workflows/**"
      instructions: |
        Flag pull_request_target jobs that check out or run PR code, untrusted ${{ }} input
        interpolated into run:, permissions wider than the job needs, and secrets reachable from
        forks. Release must stay workflow_dispatch only.

    - path: "Scripts/**/*.{sh,py}"
      instructions: |
        Release and build tooling. Flag missing error handling on a step that signs, notarises, tags
        or pushes, and anything that could publish a partial release.

    - path: "CHANGELOG.md"
      instructions: |
        The Release workflow writes each version's bullets and dated heading. By hand, a PR may only
        edit the file's preamble or add headline prose above a section's first ###, under an undated
        ## <version> heading if none exists yet. Flag hand-written or edited bullets.

    - path: "{AGENTS.md,docs/**/*.md}"
      instructions: |
        Flag only statements this PR makes false or code it changes that a doc now contradicts.
        No prose or formatting feedback.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional Commits: <type>(<optional scope>): <description>. Type is one of feat, fix,
        docs, style, refactor, perf, test, build, ci, chore, revert. Description lowercase,
        imperative, no trailing period. A breaking change carries ! after the type or scope.
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: Localized in all languages
        mode: warning
        instructions: |
          Fail only if the PR adds or changes a user-facing string in Swift (a SwiftUI literal or
          String(localized:)) and Pipcast/Resources/Localizable.xcstrings has no entry for it, or
          that entry is missing any of the eight languages. Never fail for log messages, identifiers
          or strings that are not shown to the user.
      - name: New preference is mirrored
        mode: warning
        instructions: |
          Fail only if the PR adds a persisted user preference without a matching SettingsFileKey
          case and binding in SettingsFileSchema. Also fail if a capability grant gains a
          SettingsFileKey; the Invariants in docs/features/settings-file.md list which flags must
          never have one. Never fail for a capability grant left unmirrored, or for caches, history,
          content, machine state such as palette position, or other internal state.
      - name: Docs follow the code
        mode: warning
        instructions: |
          Fail only if the PR changes behaviour that AGENTS.md, docs/*.md or the feature's
          docs/features/*.md describes, and that doc now states something false. Never fail
          because a doc could be more detailed.

  tools:
    swiftlint:
      enabled: true
      config_file: .swiftlint.yml
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    flake8:
      enabled: false
    pylint:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false

chat:
  art: false

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    filePatterns:
      - files: "docs/standards.md"
        applyTo: "**/*.swift"
      - files: "docs/architecture.md"
        applyTo: "Pipcast/**/*.swift"
      - files: "docs/ui.md"
        applyTo: "Pipcast/DesignSystem/**/*.swift,Pipcast/Palette/**/*.swift,Pipcast/Windows/**/*.swift,Pipcast/Features/*/UI/**/*.swift,Pipcast/Features/*/Settings/**/*.swift,Pipcast/Features/Settings/**/*.swift,Pipcast/Features/Onboarding/**/*.swift"
      - files: "docs/testing.md"
        applyTo: "Tests/**"
      - files: "docs/features/extensions.md"
        applyTo: "Pipcast/Features/Extensions/**,Scripts/raycast-runtime/**"
      - files: "docs/release.md"
        applyTo: ".github/workflows/release.yml,Scripts/release-*.sh,Scripts/*release*.py,Scripts/build-dmg.sh,Scripts/verify-signature.sh"
