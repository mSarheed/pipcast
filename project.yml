name: Pipcast
options:
  bundleIdPrefix: io.github.msarheed.pipcast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # A stable self-signed identity keeps the Accessibility grant across rebuilds. docs/signing.md
    CODE_SIGN_IDENTITY: "Pipcast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    PIPCAST_BUNDLE_IDENTIFIER: io.github.msarheed.pipcast.app
  configs:
    Debug:
      PIPCAST_BUNDLE_IDENTIFIER: io.github.msarheed.pipcast.app.dev
      DICTATION_EXECUTABLE_NAME: Pipcast Dev Dictation
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      DICTATION_EXECUTABLE_NAME: Pipcast Dictation
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Pipcast:
    type: application
    platform: macOS
    sources:
      - path: Pipcast
        # Helper-only sources: compiling them in would link Vision and PDFKit into the app.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/Dictation/Helper
          - Features/FileSearch/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Pipcast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      # The one changelog: the release workflow writes each section, and the app reads it.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - target: DictationHelper
        link: false
        embed: false
      # Resolve the embedded helper against the active channel, not Xcode's default configuration.
      - framework: "$(BUILT_PRODUCTS_DIR)/$(DICTATION_EXECUTABLE_NAME).app"
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Pipcast
        PRODUCT_BUNDLE_IDENTIFIER: "$(PIPCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Pipcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pipcast/Pipcast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: pipcast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, so a local build never corrupts the installed app's state.
        Debug:
          PRODUCT_NAME: Pipcast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Pipcast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Pipcast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # Pinned, or release.yml's PRODUCT_NAME renames the binary `ClipboardTextWorker` looks for.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Pipcast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Pipcast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Pipcast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Pipcast/Features/FileSearch/Model/FileSearchQuery.swift
      - Pipcast/Features/FileSearch/Model/FileSearchScope.swift
      - Pipcast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Pipcast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned like ClipboardTextHelper's: release.yml's PRODUCT_NAME would otherwise rename it.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  DictationHelper:
    type: application
    platform: macOS
    info:
      path: Pipcast/Features/Dictation/Helper/Info.plist
      properties:
        CFBundleName: "$(DICTATION_EXECUTABLE_NAME)"
        CFBundleDisplayName: "$(DICTATION_EXECUTABLE_NAME)"
        LSUIElement: true
    sources:
      - Pipcast/Features/Dictation/Helper
      - Pipcast/Features/Dictation/Model/DictationModel.swift
      - Pipcast/Features/Dictation/Model/DictationAudioChunks.swift
      - Pipcast/Features/Dictation/Model/DictationLanguage.swift
      - Pipcast/Features/Dictation/Service/DictationWire.swift
    settings:
      base:
        EXECUTABLE_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        PRODUCT_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        WRAPPER_NAME: "$(DICTATION_EXECUTABLE_NAME).app"
        PRODUCT_MODULE_NAME: DictationHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(PIPCAST_BUNDLE_IDENTIFIER).dictation"
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
