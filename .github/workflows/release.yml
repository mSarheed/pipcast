name: Release
run-name: Pipcast ${{ inputs.version || 'next' }} · ${{ inputs.channel }}
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: Base version such as 0.2.0; leave empty to derive it from the commits
        required: false
        type: string
concurrency:
  group: pipcast-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Fails in seconds, before the long build: a release with nothing new never starts.
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write the changelog and pick the version
        id: notes
        run: python3 Scripts/release-notes.py --channel "$CHANNEL" --version "$VERSION" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Commit the changelog
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md project.yml Pipcast.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m "chore(release): update the changelog for $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.notes.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    env:
      BASE_VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      ARCHITECTURE: ${{ matrix.architecture }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Compile ${{ matrix.architecture }}
        run: ./Scripts/release-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-${{ matrix.architecture }}
          path: build/release-artifacts/${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 7
  # Runs beside the build: nothing is signed or published from a commit CI has not passed.
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  package:
    needs: [prepare, build, verify]
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, universal]
    env:
      BASE_VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      ARCHITECTURE: ${{ matrix.architecture }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: compiled-arm64
          path: build/release-artifacts
      - uses: actions/download-artifact@v8
        if: matrix.architecture == 'universal'
        with:
          name: compiled-x86_64
          path: build/release-artifacts
      - name: Assemble, sign, notarize, and package
        run: ./Scripts/release-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pipcast-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error
  publish:
    permissions:
      contents: write
    needs: [prepare, package]
    runs-on: macos-26
    timeout-minutes: 15
    env:
      BASE_VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pipcast-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Publish release and update Homebrew
        run: python3 Scripts/publish-release.py
