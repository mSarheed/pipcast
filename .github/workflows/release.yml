name: Release
run-name: Pipcast ${{ inputs.version }} · ${{ inputs.channel }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Base version (for example 0.1.0)
        required: true
        type: string
      channel:
        type: choice
        options: [beta, stable]
        default: beta
concurrency:
  group: pipcast-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    env:
      BASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      ARCHITECTURE: ${{ matrix.architecture }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Compile ${{ matrix.architecture }}
        run: ./Scripts/release-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-${{ matrix.architecture }}
          path: build/release-artifacts/${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 1
  package:
    needs: build
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, universal]
    env:
      BASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      ARCHITECTURE: ${{ matrix.architecture }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: compiled-arm64
          path: build/release-artifacts
      - uses: actions/download-artifact@v8
        if: matrix.architecture == 'universal'
        with:
          name: compiled-x86_64
          path: build/release-artifacts
      - name: Assemble, sign, notarize, and package
        run: ./Scripts/release-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pipcast-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: package
    runs-on: macos-26
    timeout-minutes: 15
    env:
      BASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pipcast-*
          path: dist
          merge-multiple: true
      - name: Publish release and update Homebrew
        run: python3 Scripts/publish-release.py
