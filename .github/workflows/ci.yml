name: CI
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Harnesses
        run: ./Scripts/run-tests.sh
      - name: Lint
        run: ./Scripts/lint.sh
      - name: Pure-layer purity
        run: |
          if grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Pipcast/Features/*/Model/; then
            echo "::error::Features/*/Model/ may not import AppKit, SwiftUI or Cocoa"
            exit 1
          fi
      - name: Debug build
        run: |
          xcodebuild build -project Pipcast.xcodeproj -scheme Pipcast -configuration Debug \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
